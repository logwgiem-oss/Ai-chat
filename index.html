
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Roundtable</title>
<style>
body {
  margin: 0;
  padding: 18px;
  background: #10131d;
  color: white;
  font-family: system-ui, sans-serif;
}
main { max-width: 700px; margin: auto; }
h1 { color: #c4b5fd; }
.panel {
  background: #202738;
  padding: 16px;
  border-radius: 15px;
  margin: 14px 0;
}
input, textarea {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  border-radius: 9px;
  border: 1px solid #48516a;
  background: #111622;
  color: white;
  margin: 6px 0;
  font: inherit;
}
button {
  padding: 11px 14px;
  border: 0;
  border-radius: 9px;
  background: #a78bfa;
  color: #171323;
  font-weight: bold;
  margin: 5px 4px 5px 0;
}
button:disabled { opacity: .45; }
#status { color: #b9c2d4; font-size: 14px; }
#chat {
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-height: 55vh;
  overflow-y: auto;
}
.message {
  background: #30394d;
  padding: 12px;
  border-radius: 12px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.user { background: #443568; }
.name { color: #c4b5fd; font-weight: bold; }
</style>
</head>
<body>
<main>
<h1>◈ AI Roundtable</h1>
<p>Alex, Drew and Casey — three AI personalities, one shared model.</p>

<section class="panel">
  <h3>Discussion topic</h3>
  <input id="topic" value="Should schools teach practical life skills?">

  <button id="load">Load AI model</button>
  <button id="start" disabled>Start discussion</button>
  <button id="pause" disabled>Pause</button>
  <button id="stop" disabled>Stop</button>

  <p id="status">AI model not loaded.</p>
  <progress id="progress" value="0" max="100" style="width:100%"></progress>
</section>

<section class="panel">
  <h3>Meet the group</h3>
  <p><b>Alex:</b> The analyst</p>
  <p><b>Drew:</b> The debater</p>
  <p><b>Casey:</b> The critic</p>
</section>

<section class="panel">
  <h3>Conversation</h3>
  <div id="chat">The discussion will appear here.</div>
</section>

<section class="panel">
  <h3>Your message</h3>
  <textarea id="userMessage" rows="3"
    placeholder="Join the discussion..."></textarea>
  <button id="send" disabled>Send message</button>
  <button id="export">Export conversation</button>
  <button id="new">New discussion</button>
</section>
</main>

<script type="module">
const MODEL =
  "onnx-community/SmolLM2-135M-Instruct-ONNX-MHA";

let ai = null;
let running = false;
let paused = false;
let stopped = false;
let turn = 0;
const maxTurns = 9;
const history = [];

const roles = [
  {
    name: "Alex",
    instruction:
      "You are Alex, a thoughtful analyst. Explain the issue logically and consider evidence."
  },
  {
    name: "Drew",
    instruction:
      "You are Drew, a respectful debater. Challenge the previous argument and offer another perspective."
  },
  {
    name: "Casey",
    instruction:
      "You are Casey, a constructive critic. Identify weaknesses, missing details and possible improvements."
  }
];

const $ = id => document.getElementById(id);

function setStatus(message) {
  $("status").textContent = message;
}

function addMessage(name, text) {
  const chat = $("chat");

  if (history.length === 0) chat.innerHTML = "";

  const box = document.createElement("div");
  box.className = "message" + (name === "You" ? " user" : "");

  const heading = document.createElement("div");
  heading.className = "name";
  heading.textContent = name;

  const content = document.createElement("div");
  content.textContent = text;

  box.append(heading, content);
  chat.append(box);
  chat.scrollTop = chat.scrollHeight;

  history.push({ name, text });
}

async function loadModel() {
  $("load").disabled = true;
  setStatus("Preparing the smaller AI model...");

  try {
    const { pipeline, env } =
      await import(
        "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1"
      );

    env.useBrowserCache = true;

    ai = await pipeline(
      "text-generation",
      MODEL,
      {
        dtype: "q8",
        device: "wasm",
        progress_callback: data => {
          if (data.status === "progress" && data.total) {
            const percent = Math.round(
              100 * data.loaded / data.total
            );

            $("progress").value = percent;
            setStatus("Downloading model: " + percent + "%");
          }

          if (data.status === "initiate") {
            setStatus("Downloading " + data.file);
          }
        }
      }
    );

    setStatus("Model loaded successfully!");
    $("progress").value = 100;
    $("start").disabled = false;
    $("send").disabled = false;

  } catch (error) {
    console.error(error);
    setStatus("Model loading failed: " + error.message);
    $("load").disabled = false;
  }
}

function getContext() {
  return history.slice(-5)
    .map(item => item.name + ": " + item.text)
    .join("\n");
}

async function generateReply(role) {
  const messages = [
    {
      role: "system",
      content:
        role.instruction +
        " The discussion topic is: " + $("topic").value +
        ". Be friendly, respectful and concise. Use no more than two short sentences."
    },
    {
      role: "user",
      content:
        "Discussion so far:\n" + getContext() +
        "\nMake your next contribution."
    }
  ];

  const result = await ai(messages, {
    max_new_tokens: 48,
    do_sample: true,
    temperature: 0.7,
    return_full_text: false
  });

  let answer = result[0].generated_text;

  if (Array.isArray(answer)) {
    answer = answer.at(-1)?.content;
  }

  return String(answer || "I couldn't generate a response.").trim();
}

async function startDiscussion() {
  if (!ai || running) return;

  running = true;
  paused = false;
  stopped = false;

  $("start").disabled = true;
  $("pause").disabled = false;
  $("stop").disabled = false;

  while (!stopped && !paused && turn < maxTurns) {
    const role = roles[turn % roles.length];

    setStatus(role.name + " is thinking...");

    try {
      const answer = await generateReply(role);

      if (stopped) break;

      addMessage(role.name, answer);
      turn++;

    } catch (error) {
      setStatus("Reply error: " + error.message);
      break;
    }
  }

  running = false;
  $("pause").disabled = true;
  $("stop").disabled = true;
  $("start").disabled = false;

  if (turn >= maxTurns) {
    setStatus("Discussion limit reached. Start a new discussion.");
  } else if (paused) {
    setStatus("Discussion paused.");
  } else if (stopped) {
    setStatus("Discussion stopped.");
  }
}

$("load").addEventListener("click", loadModel);
$("start").addEventListener("click", startDiscussion);

$("pause").addEventListener("click", () => {
  paused = true;
  $("pause").disabled = true;
});

$("stop").addEventListener("click", () => {
  stopped = true;
  paused = false;
});

$("send").addEventListener("click", () => {
  const message = $("userMessage").value.trim();
  if (!message) return;

  addMessage("You", message);
  $("userMessage").value = "";
});

$("new").addEventListener("click", () => {
  stopped = true;
  paused = false;
  turn = 0;
  history.length = 0;
  $("chat").textContent = "New discussion ready.";
  setStatus(ai ? "Model ready." : "Load the AI model first.");
});

$("export").addEventListener("click", () => {
  const text = history.map(
    item => item.name + ":\n" + item.text
  ).join("\n\n");

  const file = new Blob([text], {type: "text/plain"});
  const url = URL.createObjectURL(file);
  const link = document.createElement("a");

  link.href = url;
  link.download = "roundtable-chat.txt";
  link.click();

  URL.revokeObjectURL(url);
});

$("send").disabled = true;
</script>
</body>
</html>
